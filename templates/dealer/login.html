<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dealer Login | CarCraft</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(40, 124, 255, 0.16),
                    transparent 35%
                ),
                #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }

        .login-card {
            padding: 42px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(15, 15, 15, 0.96);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 50px rgba(40, 124, 255, 0.08);
        }

        .brand {
            margin-bottom: 8px;
            color: #287cff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
            font-weight: 600;
        }

        .subtitle {
            margin: 0 0 32px;
            color: #8f98a5;
            font-size: 15px;
        }

        .error {
            margin-bottom: 20px;
            padding: 13px 15px;
            border: 1px solid rgba(255, 70, 70, 0.25);
            border-radius: 10px;
            background: rgba(255, 70, 70, 0.08);
            color: #ff8f8f;
            font-size: 14px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dce2ea;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #292929;
            border-radius: 10px;
            outline: none;
            background: #0b0b0b;
            color: #ffffff;
            font-size: 15px;
        }

        input:focus {
            border-color: #287cff;
            box-shadow: 0 0 0 3px rgba(40, 124, 255, 0.1);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #287cff;
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        button:hover {
            background: #176ce8;
            transform: translateY(-1px);
        }

        .back-link {
            display: block;
            margin-top: 24px;
            color: #8f98a5;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #ffffff;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 24px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="brand">
                CARCRAFT
            </div>

            <h1>
                Dealer Portal
            </h1>

            <p class="subtitle">
                Sign in to manage your dealership.
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="field">
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>

                <div class="field">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Sign In
                </button>

            </form>

            <a
                href="http://localhost:3000/"
                class="back-link"
            >
                ← Back to CarCraft
            </a>

        </div>

    </div>

</body>
</html>
