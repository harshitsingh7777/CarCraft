<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access Denied | CarCraft</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 520px;
            padding: 45px;
            border: 1px solid #242424;
            border-radius: 18px;
            background: #101010;
            text-align: center;
        }

        .brand {
            margin-bottom: 20px;
            color: #287cff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 32px;
        }

        p {
            margin: 0 0 28px;
            color: #9ca5b2;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 9px;
            background: #287cff;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="brand">
            CARCRAFT
        </div>

        <h1>
            Access Denied
        </h1>

        <p>
            This account is not authorized to access
            the CarCraft Dealer Portal.
        </p>

        <a href="http://localhost:3000/">
            Back to CarCraft
        </a>

    </div>

</body>
</html>
